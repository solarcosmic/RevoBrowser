<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revo</title>
    <style>
        @font-face {
            font-family: 'Golos Text';
            src: url("../assets/GolosText-VariableFont_wght.ttf");
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Golos Text", sans-serif;
        }
        #container {
            /* From https://css.glass */
            background: rgba(255, 255, 255, 0.2);
            /*border-radius: 16px;*/
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(15.8px);
            -webkit-backdrop-filter: blur(15.8px);
            /*border: 1px solid rgba(255, 255, 255, 0.3);*/
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        #webviews {
            display: flex;
            justify-content: flex-end;
            height: 100vh;
            /*border-radius: 16px;*/
            overflow: hidden;
        }
        #webviews webview {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            border: none;
            user-select: none;
        }
        #topbar {
            position: absolute;
            width: 100vw;
            z-index: 999;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }
        #topbar div {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 4px 4px;
            color: #ffffff;
            width: 500px;
            border-radius: 8px;
        }
        #url-text {
            text-align: center;
            font-size: 12px;
            width: 100%;
            background-color: #00000000;
            color: #ffffff;
            border: none;
            font-family: "Golos Text", sans-serif;
            pointer-events: auto !important;
        }
        #url-text-drawer {
            text-align: center;
            font-size: 12px;
        }
        #url-text-drawer {
            margin-bottom: 8px;
        }
        #appbar {
            position: absolute;
            width: 100vw;
            bottom: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }
        #appbar-insert {
            pointer-events: auto;
            /*background-color: rgba(0, 0, 0, 0.5);*/
            /* From https://css.glass */
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 0, 0, 0.3);
            padding: 4px 4px;
            color: #ffffff;
            border-radius: 8px;
        }
        #appbar button {
            pointer-events: auto;
            width: 64px;
            height: 64px;
            background-color: #0000008e;
            border-radius: 8px;
            border: none;
            outline: none;
        }
        #appbar button:hover {
            border: 2px solid;
            border-color: #ffffff;
        }
        #appbar button:active {
            border: 2px solid;
            border-color: #a5a5a5;
        }
        #lowcatcher {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: calc(100vh / 16);
            z-index: 998;
        }
        #catcher {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 32px;
            /*height: calc(100vh / 16);*/
            z-index: 9999;
            cursor: text;
        }
        #navcatcher {
            position: absolute;
            top: 0;
            left: 0;
            width: 128px;
            height: 32px;

        }

        #new-tab-button {
            margin-top: auto;
            position: relative;
        }

        #newtab-img {
            filter: invert(100%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(100%);
        }

        /*#topbar, #appbar {
            pointer-events: none;
        }

        #topbar *,
        #appbar * {
            pointer-events: auto;
        }*/
        #omnibox {
            display: block;
            padding: 4px 4px;
            background-color: black;
            margin: auto;
        }
        #omnibox > #suggestions {
            font-size: 12px;
        }
        #genuine-omnibox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
/* From https://css.glass */
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 0, 0, 0.3);
            /* end */
            width: 500px;
            height: 250px;
            padding: 4px 4px;
            margin: 0 auto;
            z-index: 9999;
            color: #ffffff;
            text-align: center;
        }
        #omnibox-input-text {
            background-color: #00000000;
            color: #ffffff;
            width: 100%;
            border: none;
            height: 30px;
            font-size: 15px;
            font-family: "Golos Text", sans-serif;
            outline: none;
        }
        #input-box {
            background-color: #00000079;
        }
        .padder-4px {
            padding: 4px 4px;
        }
        .omnibox-item {
            background-color: #00000054;
            color: #ffffff;
            padding: 8px 8px;
            cursor: default;
            user-select: none;
            text-align: left;
        }
        .omnibox-item:hover {
            background-color: #24242454;
        }
        [id*="nav-"] {
            /*filter: brightness(0) saturate(100%) invert(42%) sepia(18%) saturate(0%) hue-rotate(156deg) brightness(111%) contrast(103%);*/
            border: none;
        }
        .svg-white {
            filter: brightness(0) invert(1) !important;
        }
        #navigations {
            position: absolute;
            top: 0;
            left: 0;
            width: 128px;
            height: 32px;
            background-color: #0000007e;
            -webkit-border-bottom-right-radius: 4px;
            -moz-border-radius-bottomright: 4px;
            border-bottom-right-radius: 4px;
            user-select: none;
            z-index: 999;
        }
        .divider {
            border-left: 1px solid #303030;
            height: 50px;
            margin: 6px 4px;
        }
        #tabs {
            display: flex;
            flex-wrap: nowrap;
            gap: 4px;
        }
        .close-tab-button {
            position: absolute;
            background-color: #ad00007d;
            color: #ffffff;
            width: 16px;
            height: 16px;
            top: 0px;
            right: 0px;
            border-top-right-radius: 4px;
            border-bottom-left-radius: 4px;
        }
        #tabs button {
            position: relative;
        }
        #tabs button[isinfocus="true"] {
            border: 2px solid;
            border-color: #0098ff;
        }
    </style>
</head>
<body>
    <div id="container">
        <span id="shift-panel">
            <div id="nav-area">
                <div id="navigations" style="display: none;">
                    <img id="nav-back" src="../assets/chevron-left-solid-full.svg" style="width: 32px; height: 32px;" class="svg-white"></img>
                    <img id="nav-forward" src="../assets/chevron-right-solid-full.svg" style="width: 32px; height: 32px;" class="svg-white"></img>
                    <img id="nav-refresh" src="../assets/rotate-right-solid-full.svg" style="width: 32px; height: 32px;" class="svg-white"></img>
                </div>
                <div id="navcatcher"></div>
            </div>
            <div id="topbar" style="display: none;">
                <div><input type="text" id="url-text"></input></div>
                <div id="omnibox" style="display: none;">
                    <div id="suggestions">
                        <div id="suggestion_1">Search or type a URL...</div>
                    </div>
                </div>
            </div>
            <div id="appbar" style="display: none;">
                <div id="appbar-insert">
                    <div id="url-text-drawer">App Drawer</div>
                    <div id="tabs">
                        <button id="new-tab-button">
                            <img id="newtab-img" src="../assets/plus-solid-full.svg" style="width: 32px; height: 32px;">
                        </button>

                        <div class="divider"></div>
                    </div>
                </div>
            </div>
            <div id="catcher"></div>
            <div id="lowcatcher"></div>
        </span>
        <div id="genuine-omnibox" style="display: none;">
            <div id="input-box">
                <div style="padding: 8px 8px;">
                    <input type="text" id="omnibox-input-text" placeholder="Search or type a URL..."></input>
                </div>
            </div>
            <div id="omnibox-suggestions"></div>
        </div>
        <div id="webviews"></div>
    </div>
</body>
<script type="importmap">
    {
        "imports": {
            "library/packman": "./library/packman.js"
        }
    }
</script>
<script type="module" src="script.js"></script>
</html>
